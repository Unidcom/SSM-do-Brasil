<!doctype html>
<html lang="pt-BR" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <title>{{SUBJECT}}</title>
</head>
<body style="margin:0;padding:0;background-color:%%COR_FUNDO%%;">
  <span style="display:none;font-size:1px;color:%%COR_FUNDO%%;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;">{{PREHEADER}}</span>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="%%COR_FUNDO%%">
    <tr><td align="center" style="padding:20px 8px;">
      <table role="presentation" width="620" cellspacing="0" cellpadding="0" border="0" bgcolor="#FFFFFF" style="width:100%;max-width:620px;background-color:#FFFFFF;">
        <tr><td bgcolor="%%COR_FUNDO%%" align="right" style="padding:0 4px 8px;background-color:%%COR_FUNDO%%;font:400 11px %%FONTE%%;color:#8B929E;">Dificuldade para visualizar? <a href="%%VAR_ESPELHO%%" style="color:#8B929E;text-decoration:underline;">Ver no navegador</a></td></tr>
        <tr><td height="6" bgcolor="%%COR_ACENTO%%" style="height:6px;background-color:%%COR_ACENTO%%;font-size:0;line-height:0;">&nbsp;</td></tr>
        <tr><td bgcolor="%%COR_PRIMARIA%%" style="padding:28px 34px;background-color:%%COR_PRIMARIA%%;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
            <tr>
              <td><img src="%%LOGO_FUNDO_ESCURO%%" width="160" alt="%%EMPRESA%%" style="display:block;width:160px;max-width:100%;height:auto;border:0;"></td>
              <td align="right" style="color:#FFFFFF;font:500 12px %%FONTE%%;">{{EDITION_DATE}}</td>
            </tr>
          </table>
        </td></tr>
%%SECOES%%
        <tr><td bgcolor="%%COR_ESCURA%%" align="center" style="padding:28px 30px;background-color:%%COR_ESCURA%%;color:#C8D0D8;font:400 11px/1.7 %%FONTE%%;">
          <img src="%%LOGO_FUNDO_ESCURO%%" width="130" alt="%%EMPRESA%%" style="display:block;width:130px;height:auto;margin:0 auto 14px;border:0;">
          %%RODAPE%%<br>
          %%MOTIVO_RECEBIMENTO%%<br>
          <a href="%%VAR_DESCADASTRO%%" style="color:#FFFFFF;">Cancelar inscrição</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
