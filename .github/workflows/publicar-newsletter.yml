name: Publicar newsletter

on:
  push:
    branches: [main]
    paths:
      - "newsletter/2026-10-29/newsletter.html"
      - ".github/workflows/publicar-newsletter.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar newsletter
        run: |
          mkdir -p _site/baterias-entram-no-leilao
          cp newsletter/2026-10-29/newsletter.html _site/index.html
          cp newsletter/2026-10-29/newsletter.html _site/baterias-entram-no-leilao/index.html
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

# Publicação acionada após habilitar o GitHub Pages.
